name: Build Turnip AHB V5 - Galaxy S9

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            pkg-config build-essential cmake ninja-build \
            git curl wget unzip xz-utils flex bison file \
            libssl-dev zlib1g-dev libexpat1-dev \
            libzstd-dev libxml2-dev libffi-dev

          python3 -m pip install --user --upgrade pip setuptools wheel

          python3 -m pip install --user \
            meson mako packaging pyyaml ply

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build glslang 12.2.0
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch 12.2.0 \
            https://github.com/KhronosGroup/glslang.git \
            glslang-src

          cmake -S glslang-src -B glslang-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF \
            -DENABLE_OPT=OFF \
            -DENABLE_HLSL=OFF

          cmake --build glslang-build --parallel 2

          sudo cmake --install glslang-build

          hash -r

          glslangValidator --version
          which glslangValidator

      - name: Download Mesa 26.3.1
        shell: bash
        run: |
          set -euxo pipefail

          curl -L \
            https://archive.mesa3d.org/mesa-26.3.1.tar.xz \
            -o mesa.tar.xz

          tar -xf mesa.tar.xz
          mv mesa-26.3.1 mesa-src

      - name: Download AHB V5 patch artifact
        uses: actions/download-artifact@v4
        with:
          name: mesa-ahb-v5-patched-source
          repository: Rajaoprek/mesa-turnip-android-driver-v5
          run-id: 44938010677
          github-token: ${{ github.token }}

      - name: Apply AHB V5 patch
        shell: bash
        run: |
          set -euxo pipefail

          ls -lh
          test -f ahb-v5.patch

          cd mesa-src

          git init
          git add .
          git -c user.name=Build -c user.email=build@example.com commit -m "Mesa base"

          git apply --check ../ahb-v5.patch
          git apply ../ahb-v5.patch

          git diff --check
          git diff --stat

      - name: Prepare ARM64 cross file
        shell: bash
        run: |
          set -euxo pipefail

          cat > arm64-android.txt <<EOF
          [binaries]
          c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
          cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
          ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-O2', '-fPIC']
          cpp_args = ['-O2', '-fPIC']
          EOF

          cat arm64-android.txt

      - name: Configure Mesa Turnip
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"

          glslangValidator --version

          meson setup build mesa-src \
            --cross-file arm64-android.txt \
            --prefix=/usr \
            --libdir=lib \
            --buildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dwrap_mode=nodownload

      - name: Build Turnip
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C build -v libvulkan_freedreno.so

      - name: Check build output
        shell: bash
        run: |
          set -euxo pipefail

          DRIVER="$(find build -type f -name libvulkan_freedreno.so | head -n 1)"

          test -n "$DRIVER"
          test -f "$DRIVER"

          ls -lh "$DRIVER"
          file "$DRIVER"

      - name: Upload Turnip driver
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-26.3.1-AHB-V5-SCV38
          path: build/src/freedreno/vulkan/libvulkan_freedreno.so
          if-no-files-found: error
          retention-days: 14

