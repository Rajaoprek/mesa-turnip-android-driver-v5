name: Build Turnip 26.3.1 - Galaxy S9 AHB V5

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            pkg-config build-essential cmake ninja-build \
            git curl wget unzip xz-utils flex bison file \
            libssl-dev zlib1g-dev libexpat1-dev \
            libzstd-dev libxml2-dev libffi-dev

          python3 -m pip install --user --upgrade \
            pip setuptools wheel

          python3 -m pip install --user \
            meson mako packaging pyyaml ply

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          python3 --version
          cmake --version
          ninja --version
          meson --version

      - name: Build glslang 12.2.0
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch 12.2.0 \
            https://github.com/KhronosGroup/glslang.git \
            glslang-src

          cmake -S glslang-src -B glslang-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF \
            -DENABLE_OPT=OFF \
            -DENABLE_HLSL=OFF

          cmake --build glslang-build --parallel 2
          sudo cmake --install glslang-build

          hash -r
          /usr/local/bin/glslangValidator --version
          which glslangValidator

      - name: Download Mesa 26.3.1
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL \
            https://archive.mesa3d.org/mesa-26.3.1.tar.xz \
            -o mesa.tar.xz

          tar -xf mesa.tar.xz
          mv mesa-26.3.1 mesa-src

          test -d mesa-src

      - name: Apply AHB V5 safety patch
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          changes = [
              (
                  Path("mesa-src/src/freedreno/vulkan/tu_device.cc"),
                  "      assert(handle->numFds > 0);",
                  "      if (!handle || handle->numFds <= 0 || handle->data[0] < 0)\n"
                  "         return VK_ERROR_INVALID_EXTERNAL_HANDLE;",
              ),
              (
                  Path("mesa-src/src/vulkan/runtime/vk_android.c"),
                  "   assert(handle && handle->numFds > 0);",
                  "   if (!handle || handle->numFds <= 0 || handle->data[0] < 0)\n"
                  "      return VK_ERROR_INVALID_EXTERNAL_HANDLE;",
              ),
          ]

          for path, old, new in changes:
              source = path.read_text()

              if source.count(old) != 1:
                  raise SystemExit(
                      f"PATCH FAILED: anchor absent or not unique: {path}"
                  )

              path.write_text(source.replace(old, new, 1))
              print(f"Patched: {path}")

          print("AHB V5 guard patch successfully applied.")
          PY

          echo "===== VERIFY PATCH ====="

          grep -n -A2 -B1 "handle->numFds <= 0" \
            mesa-src/src/freedreno/vulkan/tu_device.cc \
            mesa-src/src/vulkan/runtime/vk_android.c

      - name: Prepare Android ARM64 cross file
        shell: bash
        run: |
          set -euxo pipefail

          cat > android-aarch64.ini <<EOF
          [binaries]
          c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang'
          cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++'
          ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-O2', '-fPIC']
          cpp_args = ['-O2', '-fPIC']
          EOF

          cat android-aarch64.ini

      - name: Configure Mesa Turnip
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"

          glslangValidator --version

          meson setup build-android-aarch64 mesa-src \
            --cross-file android-aarch64.ini \
            --prefix=/usr \
            --libdir=lib \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=29 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dstrip=true \
            -Dcpp_rtti=false \
            -Dwrap_mode=nodownload

      - name: Build Mesa Turnip
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== AVAILABLE TARGETS ====="
          ninja -C build-android-aarch64 -t targets all \
            | grep -i -E "vulkan|freedreno" || true

          echo "===== BUILD ====="
          ninja -C build-android-aarch64 -v

      - name: Locate and verify driver
        shell: bash
        run: |
          set -euxo pipefail

          DRIVER="$(find build-android-aarch64 \
            -type f -name libvulkan_freedreno.so \
            -print -quit)"

          test -n "$DRIVER"
          test -f "$DRIVER"

          echo "TURNIP_DRIVER=$DRIVER" >> "$GITHUB_ENV"

          ls -lh "$DRIVER"
          file "$DRIVER"
          sha256sum "$DRIVER"

      - name: Upload patched Turnip driver
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-26.3.1-SCV38-Android10-AHB-V5
          path: ${{ env.TURNIP_DRIVER }}
          if-no-files-found: error
          retention-days: 14

