name: AHB V5 Patch Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download Mesa 26.3.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://archive.mesa3d.org/mesa-26.3.1.tar.xz \
            -o mesa.tar.xz
          xz -t mesa.tar.xz

      - name: Extract Mesa source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir mesa-src
          tar -xJf mesa.tar.xz \
            -C mesa-src --strip-components=1

      - name: Generate AHB guard patch
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import difflib

          targets = [
              Path("mesa-src/src/freedreno/vulkan/tu_device.cc"),
              Path("mesa-src/src/vulkan/runtime/vk_android.c"),
          ]

          replacements = [
              (
                  "const native_handle_t *handle = AHardwareBuffer_getNativeHandle(mem->vk.ahardware_buffer);\n"
                  "      assert(handle->numFds > 0);",
                  "const native_handle_t *handle = AHardwareBuffer_getNativeHandle(mem->vk.ahardware_buffer);\n"
                  "      if (!handle || handle->numFds <= 0 || handle->data[0] < 0)\n"
                  "         return VK_ERROR_INVALID_EXTERNAL_HANDLE;"
              ),
              (
                  "const native_handle_t *handle = AHardwareBuffer_getNativeHandle(ahardware_buffer);\n",
                  "const native_handle_t *handle = AHardwareBuffer_getNativeHandle(ahardware_buffer);\n"
                  "   if (!handle || handle->numFds <= 0 || handle->data[0] < 0)\n"
                  "      return VK_ERROR_INVALID_EXTERNAL_HANDLE;\n"
              ),
              (
                  "const native_handle_t *handle = AHardwareBuffer_getNativeHandle(buffer);\n"
                  "   assert(handle && handle->numFds > 0);",
                  "const native_handle_t *handle = AHardwareBuffer_getNativeHandle(buffer);\n"
                  "   if (!handle || handle->numFds <= 0 || handle->data[0] < 0)\n"
                  "      return VK_ERROR_INVALID_EXTERNAL_HANDLE;"
              ),
          ]

          changed = []
          for path in targets:
              original = path.read_text()
              updated = original

              for old, new in replacements:
                  if old in updated:
                      updated = updated.replace(old, new, 1)

              if updated != original:
                  changed.append((path, original, updated))

          if not changed:
              raise SystemExit(
                  "No matching source code found. Patch not generated."
              )

          patch = []
          for path, old, new in changed:
              patch.extend(difflib.unified_diff(
                  old.splitlines(True),
                  new.splitlines(True),
                  fromfile="a/" + str(path.relative_to("mesa-src")),
                  tofile="b/" + str(path.relative_to("mesa-src")),
              ))

          Path("ahb-v5.patch").write_text("".join(patch))
          print("Generated patch:")
          print(Path("ahb-v5.patch").read_text())
          PY

      - name: Check generated patch
        shell: bash
        run: |
          set -euxo pipefail
          test -s ahb-v5.patch
          cd mesa-src
          git init -q
          git add .
          git -c user.name=CI \
              -c user.email=ci@example.com \
              commit -qm baseline
          git apply --check ../ahb-v5.patch

      - name: Apply patch
        shell: bash
        run: |
          set -euxo pipefail
          cd mesa-src
          git apply ../ahb-v5.patch
          git diff --check
          git diff --stat

      - name: Upload patched source and patch
        uses: actions/upload-artifact@v4
        with:
          name: mesa-ahb-v5-patched-source
          path: |
            ahb-v5.patch
            mesa-src/src/freedreno/vulkan/tu_device.cc
            mesa-src/src/vulkan/runtime/vk_android.c
          retention-days: 7
